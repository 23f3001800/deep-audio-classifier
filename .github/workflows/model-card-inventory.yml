name: Model card inventory
on:
  push:
    branches: [validation/model-cards-2026-10-02]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public model metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/inspect_hub_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: model-card-inventory
          path: hub-inventory/
          retention-days: 14
